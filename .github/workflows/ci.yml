name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        run: node scripts/ci.mjs classify

  docs:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      # Both checks use Node built-ins; documentation edits need no dependency install.
      - run: npm run check:docs && npm run check:package

  check:
    name: check (${{ matrix.node-version }}, Pi ${{ matrix.pi-version }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.19.0', '24']
        # The maintained Pi SDKs; scripts/ci.mjs owns the list. Pi 1.4.0 is no longer supported,
        # and 1.5.0 is both the declared minimum and the newest published SDK.
        # The peer minimum never moves with the pinned development SDK.
        pi-version: ['1.5.0']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # npm ci installs the pinned development SDK; every axis then switches the whole Pi family,
      # so each job really tests its axis version whatever the development pin is.
      - name: Install Pi ${{ matrix.pi-version }} SDK
        run: node scripts/ci.mjs install-sdk ${{ matrix.pi-version }}

      # Fails when an axis mixes Pi versions, misses part of the family, or has no host bundle.
      - name: Verify Pi SDK versions
        run: node scripts/ci.mjs verify-sdk ${{ matrix.pi-version }}

      - name: Validate
        run: npm run check

  result:
    name: CI result
    if: always()
    needs: [changes, docs, check]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node scripts/ci.mjs aggregate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
